<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Narrador de Página</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="logo-area">
                <span class="logo-icon">🎙️</span>
                <h1>Narrador de Página</h1>
            </div>
            <button type="button" id="btn-open-options" class="settings-btn" title="Configurações">⚙️</button>
        </header>

        <main class="popup-body">
            <button type="button" id="btn-toggle-play" class="main-action-btn">
                <span class="action-icon">🔊</span>
                <span class="action-text">Ouvir esta Página</span>
            </button>

            <div class="controls-row">
                <button type="button" id="btn-stop-all" class="secondary-btn" title="Parar Leitura">
                    ⏹️ Parar
                </button>

                <div class="speed-picker">
                    <label for="speed-select">Velocidade:</label>
                    <select id="speed-select">
                        <option value="0.75">0.75x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                </div>
            </div>

            <div class="status-box">
                <span class="status-indicator"></span>
                <span id="status-text">Pronto para narrar</span>
            </div>
        </main>

        <footer class="popup-footer">
            <span class="shortcut-tip">💡 Atalho: <strong>Alt + Shift + R</strong></span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
